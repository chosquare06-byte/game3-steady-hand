<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flitwick's Steady Hand Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: Georgia, serif; }
    #panel { position: fixed; top: 16px; left: 16px; max-width: 280px; padding: 14px;
             color: #f3e3bd; background: rgba(30, 18, 8, 0.85); border: 1px solid #c49b50; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    button { font: inherit; padding: 6px 18px; cursor: pointer; }
    canvas { touch-action: none; }
    .pad, #rotate { display: none; }
    .pad button { width: 56px; height: 56px; padding: 0; font-size: 20px; color: #f3e3bd;
                  background: rgba(30, 18, 8, 0.75); border: 1px solid #c49b50;
                  touch-action: none; user-select: none; -webkit-user-select: none; }
    .touch #walkPad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px;
                      position: fixed; left: 16px; bottom: 16px; }
    .touch #actions { display: flex; gap: 8px; position: fixed; right: 16px; bottom: 16px; }
    .touch #actions button { width: 76px; font-size: 16px; }
    .depth { display: none; }
    .touch.at-table #walkPad { display: none; }
    .touch.at-table .depth { display: block; }
    .touch #panel { top: 8px; left: 8px; max-width: 220px; padding: 8px; font-size: 13px; }
    .touch #panel h1, .touch #help { display: none; }
    .touch #panel p { margin: 4px 0; }
    @media (orientation: portrait) {
      .touch #rotate { display: flex; position: fixed; inset: 0; z-index: 10; align-items: center;
                       justify-content: center; text-align: center; padding: 24px;
                       color: #f3e3bd; background: #1e1208; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Flitwick's Steady Hand Test</h1>
    <p id="help">Walking: mouse to look, WASD to move<br />E: play at the table / step back<br />Playing: mouse moves ring, W/S or scroll for depth<br />R: restart. Esc: free the mouse</p>
    <p>Hits: <span id="hits">0</span></p>
    <p id="message">Press Start.</p>
    <button id="start">Start</button>
  </div>
  <div class="pad" id="walkPad">
    <span></span><button data-key="KeyW" aria-label="Forward">▲</button><span></span>
    <button data-key="KeyA" aria-label="Left">◀</button>
    <button data-key="KeyS" aria-label="Back">▼</button>
    <button data-key="KeyD" aria-label="Right">▶</button>
  </div>
  <div class="pad" id="actions">
    <button class="depth" data-key="Far">Far</button>
    <button class="depth" data-key="Near">Near</button>
    <button id="table">Table</button>
  </div>
  <div id="rotate">Please turn your phone sideways to play.</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
